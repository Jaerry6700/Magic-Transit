<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마술사 설정</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont;
      padding: 40px;
    }
    h1 { margin-bottom: 10px; }
    .box {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1b1b1b;
    }
    label { display: block; margin-top: 15px; }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      align-items: center;
    }
    input {
      width: 80px;
      padding: 8px;
      border-radius: 6px;
      border: none;
      text-align: center;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎩 마술사 설정</h1>

<div class="box">
  <h3>관객이 검색한 도시</h3>
  <p id="result">불러오는 중...</p>
</div>

<div class="box">
  <h3>✈️ 출발지 설정</h3>
  <div class="row">
    <span>사진</span>
    <input id="startFrom" type="number" placeholder="예: 3">
    <span>→</span>
    <input id="startTo" type="number" placeholder="예: 12">
  </div>
</div>

<div class="box">
  <h3>🛬 도착지 설정</h3>
  <div class="row">
    <span>사진</span>
    <input id="endFrom" type="number" placeholder="예: 14">
    <span>→</span>
    <input id="endTo" type="number" placeholder="예: 22">
  </div>
</div>

<button onclick="saveSettings()">설정 저장</button>

<script>
  document.getElementById("result").innerText =
    localStorage.getItem("selectedCity") || "아직 없음";

  document.getElementById("startFrom").value = localStorage.getItem("startFrom") || "";
  document.getElementById("startTo").value   = localStorage.getItem("startTo") || "";
  document.getElementById("endFrom").value   = localStorage.getItem("endFrom") || "";
  document.getElementById("endTo").value     = localStorage.getItem("endTo") || "";

  function saveSettings() {
    localStorage.setItem("startFrom", document.getElementById("startFrom").value);
    localStorage.setItem("startTo", document.getElementById("startTo").value);
    localStorage.setItem("endFrom", document.getElementById("endFrom").value);
    localStorage.setItem("endTo", document.getElementById("endTo").value);
    alert("설정이 저장되었습니다!");
  }
</script>

</body>
</html>
