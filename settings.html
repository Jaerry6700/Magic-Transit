<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 20px;
    background: #fff;
  }

  h2 {
    margin-bottom: 20px;
  }

  .rule-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .rule-row input {
    padding: 8px;
    width: 90px;
    border-radius: 6px;
    border: 1px solid #ccc;
    text-align: center;
  }

  .arrow {
    font-size: 18px;
    font-weight: bold;
  }

  button {
    margin-top: 16px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: white;
    font-size: 15px;
  }

  .back {
    margin-top: 20px;
    color: #1a73e8;
    cursor: pointer;
    display: inline-block;
  }
</style>
</head>

<body>

<h2>✈️ 마술 설정</h2>

<div class="rule-row">
  <input id="airline" placeholder="항공사">
  <input id="start" type="number" placeholder="시작">
  <span class="arrow">→</span>
  <input id="from" type="number" placeholder="출발지">
  <span class="arrow">→</span>
  <input id="to" type="number" placeholder="도착지">
</div>

<button onclick="saveRule()">저장</button>

<div class="back" onclick="location.href='index.html'">← 메인으로</div>

<script>
function saveRule() {
  const data = {
    airline: airline.value,
    start: Number(start.value),
    from: Number(from.value),
    to: Number(to.value)
  };

  localStorage.setItem("magicRule", JSON.stringify(data));
  alert("설정 저장 완료!");
}
</script>

</body>
</html>
