<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마술사 설정</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont;
      padding: 40px;
    }

    h1, h2 {
      margin-bottom: 10px;
    }

    .box {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1b1b1b;
    }

    .row, .rule-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: none;
      width: 120px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 15px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .note {
      font-size: 13px;
      color: #aaa;
      margin-top: 6px;
    }

    .arrow {
      color: #aaa;
      font-size: 18px;
    }

    .back {
      margin-top: 30px;
      color: #ccc;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>

<body>

<h1>🎩 마술사 설정</h1>

<!-- 관객 검색 정보 -->
<div class="box">
  <h2>🔍 관객이 검색한 도시</h2>
  <p id="result">불러오는 중...</p>
  <button onclick="resetSearch()">검색 기록 초기화</button>
</div>

<!-- 출/도착지 설정 -->
<div class="box">
  <h2>✈️ 출/도착지 설정</h2>
  <p class="note">각 줄은 하나의 마술 시나리오입니다</p>

  <div id="rules"></div>

  <button onclick="saveRules()">설정 저장</button>
</div>

<!-- 사진 업로드 -->
<div class="box">
  <h2>🖼 사진 업로드</h2>
  <p class="note">갤러리에 사용할 사진을 선택하세요</p>
  <input type="file" id="photoUpload" accept="image/*" multiple>
</div>

<div class="back" onclick="location.href='index.html'">← 메인으로</div>

<script>
  /* -------------------------
     검색 기록 표시
  -------------------------- */
  document.getElementById("result").innerText =
    localStorage.getItem("selectedCity") || "아직 없음";

  function resetSearch() {
    localStorage.removeItem("selectedCity");
    alert("검색 기록이 초기화되었습니다");
    location.reload();
  }

  /* -------------------------
     출/도착지 설정 (최대 5개)
  -------------------------- */
  const MAX_RULES = 5;
  const rulesContainer = document.getElementById("rules");
  const savedRules = JSON.parse(localStorage.getItem("magicRules") || "[]");

  for (let i = 0; i < MAX_RULES; i++) {
    const rule = savedRules[i] || {};
    const row = document.createElement("div");
    row.className = "rule-row";

    row.innerHTML = `
      <input placeholder="항공사" value="${rule.airline || ""}">
      <input type="number" placeholder="시작" value="${rule.start || ""}">
      <span class="arrow">→</span>
      <input type="number" placeholder="출발지" value="${rule.from || ""}">
      <span class="arrow">→</span>
      <input type="number" placeholder="도착지" value="${rule.to || ""}">
    `;

    rulesContainer.appendChild(row);
  }

  function saveRules() {
    const rows = document.querySelectorAll(".rule-row");
    const data = [];

    rows.forEach(row => {
      const inputs = row.querySelectorAll("input");
      if (inputs[0].value.trim() !== "") {
        data.push({
          airline: inputs[0].value,
          start: Number(inputs[1].value),
          from: Number(inputs[2].value),
          to: Number(inputs[3].value)
        });
      }
    });

    localStorage.setItem("magicRules", JSON.stringify(data));
    alert("출/도착지 설정이 저장되었습니다!");
  }

  /* -------------------------
     사진 업로드
  -------------------------- */
  document.getElementById("photoUpload").addEventListener("change", e => {
    const files = Array.from(e.target.files);
    const urls = files.map(f => URL.createObjectURL(f));
    localStorage.setItem("galleryImages", JSON.stringify(urls));
    alert("사진이 업로드되었습니다!");
  });
</script>

</body>
</html>
