<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Magic Settings</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont;
      padding: 40px;
    }
    h1 {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 20px;
    }
    select {
      width: 300px;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: none;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>마술 설정</h1>

<label>관객이 선택한 도시 위치</label>
<select>
  <option>첫 번째</option>
  <option>두 번째</option>
  <option>세 번째</option>
</select>

<label>항공사 선택</label>
<select>
  <option>Korean Air</option>
  <option>Asiana</option>
  <option>Jin Air</option>
</select>

<button onclick="alert('저장되었습니다!')">저장</button>

</body>
</html>
