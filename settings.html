<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>설정</title>
<style>
  body {
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 40px;
  }

  h1, h2 {
    margin-bottom: 10px;
  }

  .box {
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #1b1b1b;
  }

  .rule-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .rule-row input {
    padding: 6px;
    border-radius: 6px;
    border: none;
    text-align: center;
  }

  .airline {
    width: 120px;
  }

  .small {
    width: 70px;
  }

  .arrow {
    color: #aaa;
  }

  button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 15px;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .note {
    font-size: 13px;
    color: #aaa;
  }

  .link {
    margin-top: 20px;
    display: inline-block;
    color: #aaa;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>

<body>

<h1>🎩 출/도착지 설정</h1>

<!-- 관객 검색 -->
<div class="box">
  <h2>🔍 관객이 검색한 도시</h2>
  <p id="city">불러오는 중...</p>
  <button onclick="resetSearch()">검색 기록 초기화</button>
</div>

<!-- 마술 규칙 -->
<div class="box">
  <h2>✈️ 마술 시나리오</h2>
  <p class="note">한 줄 = 한 번의 마술 동작</p>

  <div id="rules"></div>

  <button onclick="saveRules()">저장</button>
</div>

<!-- 사진 -->
<div class="box">
  <h2>🖼 사진 업로드</h2>
  <input type="file" id="photoUpload" multiple accept="image/*">
</div>

<div class="link" onclick="location.href='index.html'">← 메인으로</div>
<div class="link" onclick="location.href='gallery.html'">📸 갤러리로</div>

<script>
/* ----------- 검색어 ----------- */
document.getElementById("city").innerText =
  localStorage.getItem("selectedCity") || "없음";

/* ----------- 규칙 ----------- */
const MAX = 5;
const rulesBox = document.getElementById("rules");
const saved = JSON.parse(localStorage.getItem("magicRules") || "[]");

for (let i = 0; i < MAX; i++) {
  const r = saved[i] || {};
  const row = document.createElement("div");
  row.className = "rule-row";
  row.innerHTML = `
    <input class="airline" placeholder="항공사" value="${r.airline || ""}">
    <input class="small" type="number" placeholder="시작" value="${r.start || ""}">
    <span class="arrow">→</span>
    <input class="small" type="number" placeholder="출발" value="${r.from || ""}">
    <span class="arrow">→</span>
    <input class="small" type="number" placeholder="도착" value="${r.to || ""}">
  `;
  rulesBox.appendChild(row);
}

function saveRules() {
  const rows = document.querySelectorAll(".rule-row");
  const data = [];

  rows.forEach(r => {
    const i = r.querySelectorAll("input");
    if (i[0].value) {
      data.push({
        airline: i[0].value,
        start: Number(i[1].value),
        from: Number(i[2].value),
        to: Number(i[3].value)
      });
    }
  });

  localStorage.setItem("magicRules", JSON.stringify(data));
  alert("설정 저장 완료!");
}

/* ----------- 이미지 업로드 ----------- */
document.getElementById("photoUpload").addEventListener("change", e => {
  const files = [...e.target.files];
  const urls = files.map(f => URL.createObjectURL(f));
  localStorage.setItem("galleryImages", JSON.stringify(urls));
  alert("사진이 저장되었습니다!");
});

function resetSearch() {
  localStorage.removeItem("selectedCity");
  alert("검색 기록 초기화 완료");
}
</script>

</body>
</html>
