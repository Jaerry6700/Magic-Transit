<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마술사 설정</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1b1b1b;
    }

    .row, .rule-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: none;
      width: 110px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 15px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .secondary {
      background: #333;
    }

    .note {
      font-size: 13px;
      color: #aaa;
      margin-top: 6px;
    }

    .arrow {
      font-size: 18px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<h1>🎩 마술사 설정</h1>

<!-- 관객 검색 정보 -->
<div class="box">
  <h3>🔍 관객이 검색한 도시</h3>
  <p id="result">불러오는 중...</p>
  <button onclick="resetSearch()">검색 기록 초기화</button>
</div>

<!-- ✈️ 마술 설정 -->
<div class="box">
  <h2>✈️ 마술 설정</h2>

  <div class="rule-row">
    <input id="airline" placeholder="항공사">
    <input id="start" type="number" placeholder="시작">
    <span class="arrow">→</span>
    <input id="from" type="number" placeholder="출발지">
    <span class="arrow">→</span>
    <input id="to" type="number" placeholder="도착지">
  </div>

  <button onclick="saveRule()">설정 저장</button>
</div>

<!-- 사진 업로드 -->
<div class="box">
  <h3>🖼 사진 업로드</h3>
  <p class="note">갤러리에서 사용될 사진들입니다</p>
  <input type="file" id="photoUpload" multiple accept="image/*">
</div>

<!-- 하단 버튼 -->
<div class="box">
  <button class="secondary" onclick="goHome()">메인으로 돌아가기</button>
</div>

<script>
  // 검색된 도시 표시
  document.getElementById("result").innerText =
    localStorage.getItem("selectedCity") || "아직 없음";

  // 저장된 마술 설정 불러오기
  const savedRule = JSON.parse(localStorage.getItem("magicRule") || "{}");
  if (savedRule.airline) airline.value = savedRule.airline;
  if (savedRule.start) start.value = savedRule.start;
  if (savedRule.from) from.value = savedRule.from;
  if (savedRule.to) to.value = savedRule.to;

  function saveRule() {
    const data = {
      airline: airline.value,
      start: Number(start.value),
      from: Number(from.value),
      to: Number(to.value)
    };
    localStorage.setItem("magicRule", JSON.stringify(data));
    alert("설정이 저장되었습니다!");
  }

  function resetSearch() {
    localStorage.removeItem("selectedCity");
    alert("검색 기록이 초기화되었습니다");
    location.reload();
  }

  // 사진 업로드
  document.getElementById("photoUpload").addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    const urls = files.map(f => URL.createObjectURL(f));
    localStorage.setItem("galleryImages", JSON.stringify(urls));
    alert("사진이 저장되었습니다!");
  });

  function goHome() {
    location.href = "index.html";
  }
</script>

</body>
</html>
