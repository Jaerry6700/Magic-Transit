<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마술사 설정</title>

  <!-- Google Picker -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont;
      padding: 40px;
    }

    h1 { margin-bottom: 10px; }

    .box {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1b1b1b;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: none;
      width: 120px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 15px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>🎩 출/도착지 설정</h1>

<div class="box">
  <h3>✈️ 마술 규칙</h3>

  <div class="row">
    <input id="airline" placeholder="항공사">
    <input id="start" type="number" placeholder="시작">
    →
    <input id="from" type="number" placeholder="출발지">
    →
    <input id="to" type="number" placeholder="도착지">
  </div>

  <button onclick="saveRule()">저장</button>
</div>

<div class="box">
  <h3>🖼 Google Drive 사진 불러오기</h3>
  <button onclick="initGoogle()">📁 구글 드라이브에서 선택</button>
</div>

<script>
/* ================================
   🔐 여기에만 값 입력
================================ */
const CLIENT_ID = "971878482556-7jh1slb1lcc75i85an9boveo44o7uasr.apps.googleusercontent.com";
const DEVELOPER_KEY = "AIzaSyDZDtjNENld8rWzKa_VDr0UJ_pu7B59mNU";

/* ================================
   Google Picker 설정
================================ */
const SCOPES = "https://www.googleapis.com/auth/drive.readonly";
let tokenClient;
let accessToken = null;

function initGoogle() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (tokenResponse) => {
      accessToken = tokenResponse.access_token;
      openPicker();
    }
  });
  tokenClient.requestAccessToken();
}

function openPicker() {
  const view = new google.picker.View(google.picker.ViewId.DOCS_IMAGES);

  const picker = new google.picker.PickerBuilder()
    .setDeveloperKey(DEVELOPER_KEY)
    .setOAuthToken(accessToken)
    .addView(view)
    .setCallback(pickerCallback)
    .build();

  picker.setVisible(true);
}

function pickerCallback(data) {
  if (data.action === google.picker.Action.PICKED) {
    const file = data.docs[0];
    let images = JSON.parse(localStorage.getItem("galleryImages") || "[]");
    images.push(file.url);
    localStorage.setItem("galleryImages", JSON.stringify(images));
    alert("사진이 갤러리에 추가되었습니다!");
  }
}

/* ================================
   설정 저장
================================ */
function saveRule() {
  const data = {
    airline: airline.value,
    start: Number(start.value),
    from: Number(from.value),
    to: Number(to.value)
  };

  localStorage.setItem("magicRule", JSON.stringify(data));
  alert("설정이 저장되었습니다!");
}
</script>

</body>
</html>
