<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마술사 설정</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1b1b1b;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 15px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    input[type="number"],
    input[type="file"] {
      padding: 8px;
      border-radius: 6px;
      border: none;
      width: 120px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 15px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .secondary {
      background: #333;
    }

    .note {
      font-size: 13px;
      color: #aaa;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<h1>🎩 마술사 설정</h1>

<!-- 관객 검색 정보 -->
<div class="box">
  <h3>🔍 관객이 검색한 도시</h3>
  <p id="result">불러오는 중...</p>

  <button onclick="resetSearch()">검색 기록 초기화</button>
</div>

<!-- 출발 / 도착 설정 -->
<div class="box">
  <h3>✈️ 출발 · 도착 설정</h3>

  <label>출발 트리거 (X → 이동)</label>
  <div class="row">
    <span>사진</span>
    <input id="startFrom" type="number" placeholder="예: 3">
    <span>→</span>
    <input id="startTo" type="number" placeholder="예: 12">
  </div>

  <label style="margin-top:20px;">도착 트리거 (두 번째 X)</label>
  <div class="row">
    <span>사진</span>
    <input id="endFrom" type="number" placeholder="예: 14">
    <span>→</span>
    <input id="endTo" type="number" placeholder="예: 22">
  </div>
</div>

<!-- 사진 업로드 -->
<div class="box">
  <h3>🖼 사진 업로드</h3>
  <p class="note">업로드한 사진은 갤러리에서 자동으로 사용됩니다</p>
  <input type="file" id="photoUpload" multiple accept="image/*">
</div>

<!-- 버튼 -->
<div class="box">
  <button onclick="saveSettings()">설정 저장</button>
  <button class="secondary" onclick="goHome()">메인으로 돌아가기</button>
</div>

<script>
  // 검색된 도시 표시
  document.getElementById("result").innerText =
    localStorage.getItem("selectedCity") || "아직 검색된 도시 없음";

  // 기존 설정 불러오기
  ["startFrom","startTo","endFrom","endTo"].forEach(id => {
    document.getElementById(id).value = localStorage.getItem(id) || "";
  });

  // 설정 저장
  function saveSettings() {
    localStorage.setItem("startFrom", startFrom.value);
    localStorage.setItem("startTo", startTo.value);
    localStorage.setItem("endFrom", endFrom.value);
    localStorage.setItem("endTo", endTo.value);
    alert("설정이 저장되었습니다!");
  }

  // 검색 기록 초기화
  function resetSearch() {
    localStorage.removeItem("selectedCity");
    alert("검색 기록이 초기화되었습니다.");
    location.reload();
  }

  // 사진 업로드
  document.getElementById("photoUpload").addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    const urls = files.map(f => URL.createObjectURL(f));
    localStorage.setItem("galleryImages", JSON.stringify(urls));
    alert("사진이 저장되었습니다!");
  });

  // 메인으로 이동
  function goHome() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
