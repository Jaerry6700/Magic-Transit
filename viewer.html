<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    touch-action: pan-y;
  }

  img {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    transition: transform 0.3s ease;
  }

  .close {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 26px;
    color: white;
    z-index: 10;
  }
</style>
</head>

<body>

<div class="close" onclick="goBack()">✕</div>
<img id="photo">

<script>
  const images = JSON.parse(localStorage.getItem("galleryImages")) || [];
  let index = Number(localStorage.getItem("currentIndex")) || 1;

  const startFrom = Number(localStorage.getItem("startFrom"));
  const startTo   = Number(localStorage.getItem("startTo"));
  const endFrom   = Number(localStorage.getItem("endFrom"));
  const endTo     = Number(localStorage.getItem("endTo"));

  const img = document.getElementById("photo");

  function showImage(i) {
    if (i < 1 || i > images.length) return;
    index = i;
    img.src = images[i - 1];
  }

  showImage(index);

  // ===== 스와이프 처리 =====
  let startX = 0;
  let endX = 0;

  document.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  document.addEventListener("touchend", e => {
    endX = e.changedTouches[0].clientX;
    handleSwipe();
  });

  function handleSwipe() {
    const diff = startX - endX;

    // 오른쪽 → 왼쪽 (다음)
    if (diff > 50) {
      next();
    }

    // 왼쪽 → 오른쪽 (이전)
    if (diff < -50) {
      prev();
    }
  }

  function next() {
    if (index < images.length) {
      index++;
      showImage(index);
    }
  }

  function prev() {
    if (index > 1) {
      index--;
      showImage(index);
    }
  }

  // 🔥 마술 로직 (뒤로가기 트릭)
  function goBack() {
    if (index === startFrom) {
      localStorage.setItem("currentIndex", startTo);
      location.reload();
      return;
    }

    if (index === endFrom) {
      localStorage.setItem("currentIndex", endTo);
      location.reload();
      return;
    }

    history.back();
  }
</script>

</body>
</html>
