<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  img {
    width: 100%;
    height: 100vh;
    object-fit: contain;
  }

  .close {
    position: fixed;
    top: 15px;
    right: 15px;
    color: white;
    font-size: 26px;
    z-index: 10;
  }
</style>
</head>

<body>

<div class="close" onclick="goBack()">✕</div>
<img id="photo">

<script>
  const images = JSON.parse(localStorage.getItem("galleryImages"));
  let index = Number(localStorage.getItem("currentIndex"));

  const startFrom = Number(localStorage.getItem("startFrom"));
  const startTo   = Number(localStorage.getItem("startTo"));
  const endFrom   = Number(localStorage.getItem("endFrom"));
  const endTo     = Number(localStorage.getItem("endTo"));

  const img = document.getElementById("photo");
  img.src = images[index - 1];

  function goBack() {
    if (index === startFrom) {
      localStorage.setItem("currentIndex", startTo);
      location.reload();
      return;
    }
    if (index === endFrom) {
      localStorage.setItem("currentIndex", endTo);
      location.reload();
      return;
    }
    history.back();
  }
</script>

</body>
</html>
