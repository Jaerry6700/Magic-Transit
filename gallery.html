<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
  body {
    margin: 0;
    background: #000;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 6px;
  }

  img {
    width: 100%;
    border-radius: 8px;
  }
</style>
</head>

<body>

<script>
  const images = JSON.parse(localStorage.getItem("galleryImages") || "[]");
  const startFrom = Number(localStorage.getItem("startFrom"));
  const startTo   = Number(localStorage.getItem("startTo"));
  const endFrom   = Number(localStorage.getItem("endFrom"));
  const endTo     = Number(localStorage.getItem("endTo"));

  images.forEach((src, index) => {
    const img = document.createElement("img");
    img.src = src;

    img.onclick = () => {
      localStorage.setItem("currentIndex", index + 1);
      window.location.href = "viewer.html";
    };

    document.body.appendChild(img);
  });
</script>

</body>
</html>
