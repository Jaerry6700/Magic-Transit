<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Gallery</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
    }

    img {
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<script>
  const TOTAL_PHOTOS = 30;

  const startFrom = Number(localStorage.getItem("start_from"));
  const startTo   = Number(localStorage.getItem("start_to"));
  const endFrom   = Number(localStorage.getItem("end_from"));
  const endTo     = Number(localStorage.getItem("end_to"));

  const pendingJump = localStorage.getItem("pendingJump");

  for (let i = 1; i <= TOTAL_PHOTOS; i++) {
    const img = document.createElement("img");
    img.src = `img/${i}.jpg`;
    img.onclick = () => openPhoto(i);
    document.body.appendChild(img);
  }

  function openPhoto(num) {
    localStorage.setItem("currentPhoto", num);
    window.location.href = "viewer.html";
  }

  // 특정 조건일 때 화면 터치하면 강제 이동
  if (pendingJump) {
    document.body.addEventListener("click", () => {
      localStorage.removeItem("pendingJump");
      openPhoto(Number(pendingJump));
    }, { once: true });
  }
</script>

</body>
</html>
