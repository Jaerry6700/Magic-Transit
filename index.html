<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    height: 100vh;
    overflow: hidden;
  }

  /* 상단 상태바 공간 */
  .top-safe {
    height: 44px;
  }

  /* 상단 메뉴 */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
  }

  .top-left {
    font-size: 15px;
    color: #1a73e8;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .profile {
    width: 32px;
    height: 32px;
    background: #1a73e8;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
  }

  /* 메인 영역 */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 60px;
  }

  .logo {
    width: 160px;
    margin-bottom: 20px;
  }

  .search-box {
    width: 90%;
    max-width: 360px;
    border: 1px solid #ddd;
    border-radius: 999px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-box input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 16px;
  }

  .icon {
    width: 20px;
    opacity: 0.6;
  }

  /* 하단 영역 */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 10px 0 20px;
    background: #fff;
    text-align: center;
    font-size: 14px;
    color: #666;
  }

  .bottom-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 8px;
  }

  .bottom-links span {
    cursor: pointer;
  }
</style>
</head>

<body>

<!-- 상단 여백 -->
<div class="top-safe"></div>

<!-- 상단 메뉴 -->
<div class="top-bar">
  <div class="top-left">전체</div>

  <div class="top-right">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_Apps_Icon.png" width="20">
    <div class="profile" onclick="goSettings()">S</div>
  </div>
</div>

<!-- 중앙 -->
<div class="center">
  <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">

  <div class="search-box">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/622/622669.png">
    <input id="searchInput" placeholder="Google 검색 또는 URL 입력">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/1828/1828911.png">
  </div>
</div>

<!-- 하단 -->
<div class="bottom-bar">
  대한민국
  <div class="bottom-links">
    <span>광고</span>
    <span>비즈니스</span>
    <span>개인정보처리방침</span>
    <span>설정</span>
  </div>
</div>

<script>
  // 검색 실행
  document.querySelector(".search-box input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      localStorage.setItem("selectedCity", e.target.value);
      window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(e.target.value);
    }
  });

  // 프로필 → 설정
  function goSettings() {
    window.location.href = "settings.html";
  }
</script>

</body>
</html>
