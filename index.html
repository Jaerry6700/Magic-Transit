<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Google</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="top-left">
      <span class="menu-item" onclick="goAlbum()">이미지</span>
    </div>

    <div class="top-right">
      <a href="settings.html" class="profile">S</a>
    </div>
  </div>

  <!-- 중앙 영역 -->
  <div class="center">
    <img
      src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
      class="logo"
      onclick="resetSearch()"
    >

    <form id="searchForm">
      <input
        type="text"
        id="searchInput"
        placeholder="Google 검색 또는 URL 입력"
        autocomplete="off"
      >
    </form>
  </div>

  <script>
    // 검색 저장 + 실제 구글 이동
    document.getElementById("searchForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const keyword = document.getElementById("searchInput").value;
      localStorage.setItem("selectedCity", keyword);
      window.location.href =
        "https://www.google.com/search?q=" + encodeURIComponent(keyword);
    });

    // 검색 기록 초기화
    function resetSearch() {
      localStorage.removeItem("selectedCity");
      alert("검색 기록이 초기화되었습니다");
    }

    // 앨범으로 이동
    function goAlbum() {
      window.location.href = "gallery.html";
    }
  </script>

</body>
</html>
