<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Google</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="top-right">
      <span class="apps">⋮⋮⋮</span>
      <div class="profile" onclick="openSettings()">S</div>
    </div>
  </div>

  <!-- 메인 로고 -->
  <div class="center">
    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" class="logo">

    <input
      id="searchInput"
      type="text"
      placeholder="Google 검색 또는 URL 입력"
      onkeydown="search(event)"
    >
  </div>

<script>
function search(e) {
  if (e.key === "Enter") {
    const keyword = e.target.value.trim();
    if (!keyword) return;

    localStorage.setItem("selectedCity", keyword);
    window.location.href =
      "https://www.google.com/search?q=" + encodeURIComponent(keyword);
  }
}

function openSettings() {
  window.location.href = "settings.html";
}
</script>

</body>
</html>
