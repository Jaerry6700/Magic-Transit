<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Google</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 프로필 아이콘 -->
  <div class="top-right">
    <a href="settings.html" title="설정">
      <div class="profile">S</div>
    </a>
  </div>

  <!-- 메인 로고 -->
  <div class="center">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
         alt="Google"
         class="logo">

    <!-- 검색창 -->
    <form id="searchForm">
     .builder.        <input
        type="text"
        id="searchInput"
        placeholder="Google 검색 또는 URL 입력"
        autocomplete="off"
      >
    </form>
  </div>

  <script>
    document.getElementById("searchForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const keyword = document.getElementById("searchInput").value;

      // 관객이 입력한 단어 저장
      localStorage.setItem("selectedCity", keyword);

      // 실제 구글 검색으로 이동 (자연스럽게)
      window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(keyword);
    });
  </script>

</body>
</html>
