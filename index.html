<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<!-- Google Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    height: 100vh;
    overflow: hidden;
  }

  .material-symbols-outlined {
    font-variation-settings: 'wght' 300;
    font-size: 22px;
    color: #5f6368;
  }

  /* 상단 safe */
  .top-safe {
    height: 44px;
  }

  /* 상단 바 */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
  }

  .top-left {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
  }

  .top-left span {
    cursor: pointer;
  }

  .top-left .active {
    color: #1a73e8;
    font-weight: 500;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .profile {
    width: 32px;
    height: 32px;
    background: #d6d6d6;
    color: #333;
    border-radius: 50%;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 중앙 */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 56px;
  }

  .logo {
    width: 160px;
    margin-bottom: 22px;
  }

  .search-box {
    width: 90%;
    max-width: 360px;
    border: 1px solid #dadce0;
    border-radius: 999px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
  }

  /* 하단 */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #fff;
    padding: 10px 0 20px;
    text-align: center;
    font-size: 14px;
    color: #666;
    border-top: 1px solid #e5e5e5;
  }

  .bottom-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 8px;
  }
</style>
</head>

<body>

<div class="top-safe"></div>

<!-- 상단 -->
<div class="top-bar">
  <div class="top-left">
    <span class="material-symbols-outlined">science</span>
    <span class="active">전체</span>
    <span onclick="location.href='gallery.html'">이미지</span>
  </div>

  <div class="top-right">
    <span class="material-symbols-outlined">notifications</span>
    <span class="material-symbols-outlined">apps</span>
    <div class="profile" onclick="location.href='settings.html'">S</div>
  </div>
</div>

<!-- 중앙 -->
<div class="center">
  <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">

  <div class="search-box">
    <span class="material-symbols-outlined">search</span>
    <input placeholder="Google 검색 또는 URL 입력">
    <span class="material-symbols-outlined">mic</span>
    <span class="material-symbols-outlined">photo_camera</span>
  </div>
</div>

<!-- 하단 -->
<div class="bottom-bar">
  대한민국
  <div class="bottom-links">
    <span>광고</span>
    <span>비즈니스</span>
    <span>개인정보처리방침</span>
    <span>설정</span>
  </div>
</div>

<script>
  document.querySelector("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      localStorage.setItem("selectedCity", e.target.value);
      window.location.href =
        "https://www.google.com/search?q=" + encodeURIComponent(e.target.value);
    }
  });
</script>

</body>
</html>
